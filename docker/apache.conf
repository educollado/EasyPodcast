<VirtualHost *:80>
    DocumentRoot /var/www/html

    # Soporte para reverse proxies con terminación SSL (Traefik, nginx-proxy, etc.)
    # Permite que el .htaccess detecte HTTPS correctamente sin bucle de redirección.
    SetEnvIf X-Forwarded-Proto "https" HTTPS=on

    <Directory /var/www/html>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

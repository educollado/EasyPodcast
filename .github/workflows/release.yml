name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: version
        run: |
          TAG=${{ github.ref_name }}
          VERSION=${TAG#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create source tarball
        run: |
          git archive --format=tar --prefix=EasyPodcast-${{ steps.version.outputs.version }}/ HEAD | gzip > EasyPodcast-${{ steps.version.outputs.version }}-source.tar.gz

      - name: Create source zip
        run: |
          git archive --format=zip --prefix=EasyPodcast-${{ steps.version.outputs.version }}/ HEAD > EasyPodcast-${{ steps.version.outputs.version }}-source.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: EasyPodcast ${{ steps.version.outputs.version }}
          body: |
            Vea [CHANGELOG.md](https://github.com/educollado/easypodcast/blob/${{ github.ref_name }}/CHANGELOG.md) para detalles de esta versión.
          files: |
            EasyPodcast-${{ steps.version.outputs.version }}-source.tar.gz
            EasyPodcast-${{ steps.version.outputs.version }}-source.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
